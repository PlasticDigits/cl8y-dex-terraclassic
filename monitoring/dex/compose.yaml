# Separate Coolify application. Paths use repository root, matching Coolify.
# Locally: docker compose --project-directory . -f monitoring/dex/compose.yaml ...
services:
  dex-exporter:
    build:
      context: .
      dockerfile: monitoring/dex/Dockerfile
    volumes:
      - alert-receipts:/state
    expose: ["9800", "9801"]
    mem_limit: 256m
    cpus: 0.25
    restart: unless-stopped
    networks: [default]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9800/metrics', timeout=2).read(65536)"]
      interval: 30s
      timeout: 3s
      retries: 3
  dex-prometheus:
    build:
      context: .
      dockerfile: monitoring/dex/Dockerfile.prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=2GB
      - --query.max-concurrency=4
      - --query.timeout=10s
    volumes:
      - prometheus-data:/prometheus
    expose: ["9090"]
    mem_limit: 512m
    cpus: 0.5
    restart: unless-stopped
    networks:
      default:
      logs:
        aliases: [dex-prometheus]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/-/ready || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
  dex-alertmanager:
    build:
      context: .
      dockerfile: monitoring/dex/Dockerfile.alertmanager
    command: ["--config.file=/etc/alertmanager/alertmanager.yml", "--storage.path=/alertmanager", "--cluster.listen-address="]
    volumes:
      - alertmanager-data:/alertmanager
    expose: ["9093"]
    mem_limit: 128m
    cpus: 0.25
    restart: unless-stopped
    networks: [default]
  dex-drill:
    build:
      context: .
      dockerfile: monitoring/dex/Dockerfile
    command: ["python3", "-I", "/app/drill.py", "--loop"]
    stop_grace_period: 60s
    volumes:
      - drill-receipts:/state
    mem_limit: 64m
    cpus: 0.1
    restart: unless-stopped
    networks: [default]
    depends_on:
      dex-prometheus:
        condition: service_healthy
networks:
  logs:
    external: true
    # Existing Grafana network, verified against Coolify resource identity.
    name: iyi1s7ihy8icleonjdivpac9
volumes:
  prometheus-data:
  alertmanager-data:
  alert-receipts:
  drill-receipts:
