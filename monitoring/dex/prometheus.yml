global:
  scrape_interval: 30s
  scrape_timeout: 5s
  evaluation_interval: 5s
rule_files: [/etc/prometheus/alerts.yml]
alerting:
  alertmanagers:
    - static_configs:
        - targets: [dex-alertmanager:9093]
scrape_configs:
  - job_name: cl8y-dex-api
    sample_limit: 100
    label_limit: 8
    body_size_limit: 64KB
    static_configs:
      - targets: [dex-exporter:9800]
        labels:
          service: cl8y-dex-terraclassic-indexer
    metric_relabel_configs:
      - source_labels: [__name__, purpose]
        regex: 'dex_endpoint_(up|http_status|duration_seconds);(liveness|serving|quote_readiness)|dex_observation_timestamp_seconds;'
        action: keep
  - job_name: cl8y-dex-indexer
    sample_limit: 100
    label_limit: 8
    body_size_limit: 64KB
    static_configs:
      - targets: [dex-exporter:9800]
        labels:
          service: cl8y-dex-terraclassic-indexer
    metric_relabel_configs:
      - source_labels: [__name__, purpose]
        regex: 'dex_endpoint_(up|http_status|duration_seconds);indexer_readiness|dex_indexer_.*;|dex_observation_timestamp_seconds;'
        action: keep
  - job_name: cl8y-dex-monitor
    sample_limit: 100
    static_configs:
      - targets: [dex-exporter:9800]
        labels:
          service: cl8y-dex-terraclassic-indexer
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'dex_monitoring_drill|dex_alert_.*'
        action: keep
  - job_name: cl8y-dex-prometheus
    sample_limit: 1000
    static_configs:
      - targets: [localhost:9090]
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'prometheus_config_last_reload_successful|prometheus_tsdb_head_series|prometheus_tsdb_storage_blocks_bytes|process_resident_memory_bytes'
        action: keep
  - job_name: cl8y-dex-alertmanager
    sample_limit: 1000
    static_configs:
      - targets: [dex-alertmanager:9093]
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'alertmanager_notifications_total|alertmanager_notifications_failed_total|process_resident_memory_bytes'
        action: keep
