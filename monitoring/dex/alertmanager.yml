global:
  resolve_timeout: 1m
route:
  receiver: dex-agent-receipts
  group_by: [alertname, job, purpose]
  group_wait: 5s
  group_interval: 10s
  repeat_interval: 4h
receivers:
  - name: dex-agent-receipts
    webhook_configs:
      - url: http://dex-exporter:9801/alerts
        send_resolved: true
        max_alerts: 32
