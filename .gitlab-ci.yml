# GitLab CI — QA artifact publishing (GitLab #325) + supply-chain security (#380).
# Reference GitHub workflows in .github/workflows/ are not executed here.

stages:
  - security
  - build

variables:
  CARGO_HOME: ${CI_PROJECT_DIR}/.cargo
  # -A dead_code: binary target has many intentional stubs (LCD types, sqlx rows); #325 never got a green run before #370.
  RUSTFLAGS: "-D warnings -A dead_code"
  # DinD TLS (GitLab #380 / M-11): encrypted Docker API on 2376; certs under /certs (docker:24-dind default).
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_HOST: tcp://docker:2376
  DOCKER_TLS_VERIFY: 1
  DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"
  # Pinned supply-chain scanner image (M-13).
  GITLEAKS_IMAGE: "ghcr.io/gitleaks/gitleaks:v8.24.2"

# --- Security stage (#380) ---

.security-rules-default-branch:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "schedule"

gitleaks:
  extends: .security-rules-default-branch
  stage: security
  image:
    name: $GITLEAKS_IMAGE
    entrypoint: [""]
  script:
    # Working-tree only: git history predates #118 dev-wallet fix (see AGENTS_BUNDLE_DEV_WALLET.md).
    - gitleaks detect --source . --no-git --verbose --config .gitleaks.toml --redact
  # Mandatory on default branch — never allow_failure (#380 / M-13).

cargo-audit-smartcontracts:
  extends: .security-rules-default-branch
  stage: security
  image: rust:1.96-bookworm
  rules:
    - !reference [.security-rules-default-branch, rules]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - smartcontracts/**/*
        - smartcontracts/.cargo/audit.toml
        - .gitlab-ci.yml
  before_script:
    - cargo install cargo-audit --locked
  script:
    - cd smartcontracts && cargo audit --deny warnings
  cache:
    key: cargo-audit-smartcontracts
    paths:
      - .cargo/bin/
      - .cargo/registry/

cargo-audit-indexer:
  extends: .security-rules-default-branch
  stage: security
  image: rust:1.96-bookworm
  rules:
    - !reference [.security-rules-default-branch, rules]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - indexer/**/*
        - indexer/.cargo/audit.toml
        - .gitlab-ci.yml
  before_script:
    - cargo install cargo-audit --locked
  script:
    - cd indexer && cargo audit --deny warnings
  cache:
    key: cargo-audit-indexer
    paths:
      - .cargo/bin/
      - .cargo/registry/

npm-audit-frontend:
  extends: .security-rules-default-branch
  stage: security
  image: node:24-bookworm
  rules:
    - !reference [.security-rules-default-branch, rules]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - frontend-dapp/package.json
        - frontend-dapp/package-lock.json
        - .gitlab-ci.yml
  before_script:
    - cd frontend-dapp && npm ci --omit=dev
  script:
    - cd frontend-dapp && npm audit --audit-level=high --omit=dev
  # Runtime-only audit; elliptic/cosmjs accepted risk documented in docs/supply-chain-security.md (#380 / L-12).

# --- Build stage (#325) ---

qa-wasm-artifacts:
  stage: build
  image: docker:24
  services:
    - name: docker:24-dind
      alias: docker
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - smartcontracts/**/*
        - scripts/deploy-dex-local.sh
        - .gitlab-ci.yml
    - if: $CI_PIPELINE_SOURCE == "web"
  before_script:
    - apk add --no-cache bash curl make git jq
    - |
      for i in $(seq 1 60); do
        if docker info >/dev/null 2>&1; then
          echo "Docker (TLS) ready"
          break
        fi
        if [ "$i" -eq 60 ]; then
          echo "ERROR: docker info failed after 60s (check DinD TLS certs)"
          exit 1
        fi
        sleep 1
      done
  script:
    - make build-optimized
    - chmod +x scripts/qa/publish-qa-ci-artifacts.sh
    - PUBLISH_QA_INDEXER=0 ./scripts/qa/publish-qa-ci-artifacts.sh
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - smartcontracts/artifacts/cl8y_dex_*.wasm
      - smartcontracts/wasm-checksums.txt

qa-indexer-binary:
  stage: build
  # base64ct 1.8+ needs edition 2024 (Rust 1.85+); align with AGENTS.md 1.96+ local toolchain.
  image: rust:1.96-bookworm
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - indexer/**/*
        - .gitlab-ci.yml
    - if: $CI_PIPELINE_SOURCE == "web"
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends libssl-dev pkg-config curl
  script:
    - cd indexer && cargo build --release
    - chmod +x ../scripts/qa/publish-qa-ci-artifacts.sh
    - cd .. && PUBLISH_QA_WASM=0 ./scripts/qa/publish-qa-ci-artifacts.sh
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - indexer/target/release/cl8y-dex-indexer
