# GitLab CI — QA artifact publishing (GitLab #325) + supply-chain security (#380).
# Reference GitHub workflows in .github/workflows/ are not executed here.

stages:
  - security
  - test
  - build

variables:
  CARGO_HOME: /tmp/cl8y-ci-cargo-${CI_JOB_ID}
  CARGO_TARGET_DIR: /tmp/cl8y-ci-target-${CI_JOB_ID}
  # -A dead_code: binary target has many intentional stubs (LCD types, sqlx rows); #325 never got a green run before #370.
  RUSTFLAGS: "-D warnings -A dead_code"
  # DinD TLS (GitLab #380 / M-11): encrypted Docker API on 2376; certs under /certs (docker:24-dind default).
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_HOST: tcp://docker:2376
  DOCKER_TLS_VERIFY: 1
  DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"
  # Registry manifest digests are recorded in scripts/ci/image-pins.json (#1400).
  # No shared executable/registry cache is read or written by any CI job.
  # Pinned supply-chain scanner image (M-13).
  GITLEAKS_IMAGE: "ghcr.io/gitleaks/gitleaks:v8.24.2@sha256:b5918eb91b8d2473cec722f066abb4352e4ffdc4ec9f4283ec143aba9ec9ebc4"

# Cold job containers prevent MR-produced executables from reaching trusted jobs.
default:
  cache: []

# --- Security stage (#380) ---

.security-rules-default-branch:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "schedule"

gitleaks:
  extends: .security-rules-default-branch
  stage: security
  image:
    name: $GITLEAKS_IMAGE
    entrypoint: [""]
  rules:
    - !reference [.security-rules-default-branch, rules]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    # Git-tracked files only (no build-dir allowlist bypass; fixture tree excluded).
    # History predates #118 dev-wallet fix — see AGENTS_BUNDLE_DEV_WALLET.md.
    - chmod +x scripts/ci/gitleaks-scan-tracked.sh
    - ./scripts/ci/gitleaks-scan-tracked.sh --verbose
  # Mandatory on default branch — never allow_failure (#380 / M-13).

lint-indexer-log-secrets:
  extends: .security-rules-default-branch
  stage: security
  image: alpine:3.24@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
  rules:
    - !reference [.security-rules-default-branch, rules]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - indexer/**/*
        - scripts/lint-indexer-log-secrets.sh
        - .gitlab-ci.yml
  before_script:
    - apk add --no-cache ripgrep bash
  script:
    - chmod +x scripts/lint-indexer-log-secrets.sh
    - ./scripts/lint-indexer-log-secrets.sh

cargo-audit-smartcontracts:
  extends: .security-rules-default-branch
  stage: security
  image: rust:1.96-bookworm@sha256:a339861ae23e9abb272cea45dfafde21760d2ce6577a70f8a926153677902663
  rules:
    - !reference [.security-rules-default-branch, rules]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - smartcontracts/**/*
        - smartcontracts/.cargo/audit.toml
        - .gitlab-ci.yml
  before_script:
    - cargo install cargo-audit --version 0.22.2 --locked
  script:
    - cd smartcontracts && cargo audit --deny warnings

cargo-audit-indexer:
  extends: .security-rules-default-branch
  stage: security
  image: rust:1.96-bookworm@sha256:a339861ae23e9abb272cea45dfafde21760d2ce6577a70f8a926153677902663
  rules:
    - !reference [.security-rules-default-branch, rules]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - indexer/**/*
        - indexer/.cargo/audit.toml
        - .gitlab-ci.yml
  before_script:
    - cargo install cargo-audit --version 0.22.2 --locked
  script:
    - cd indexer && cargo audit --deny warnings

npm-audit-frontend:
  extends: .security-rules-default-branch
  stage: security
  image: node:24-bookworm@sha256:64af3819f9275802414d7cdc38c27e9d82bd564dec4d4da87d008255d36c63b4
  rules:
    - !reference [.security-rules-default-branch, rules]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - frontend-dapp/package.json
        - frontend-dapp/package-lock.json
        - .gitlab-ci.yml
  before_script:
    - cd frontend-dapp && npm ci --omit=dev
  script:
    - npm audit --audit-level=high --omit=dev
  # Runtime-only audit; elliptic/cosmjs accepted risk documented in docs/supply-chain-security.md (#380 / L-12).

# --- Test stage (GitLab #421): functional gates from the reference matrix ---
# Phase 1: fast unit + build gates on MR + default branch, mirroring .github/workflows/test.yml
# (contracts-terra / frontend / indexer). Phase 2a adds the Postgres-backed indexer-integration
# suite (a `postgres` service container, below); the scheduled DinD-LocalTerra Playwright E2E is
# the remaining Phase-2 row. No allow_failure — a red functional gate blocks merge (#411: "GitLab
# CI green != functional test pass"). Test jobs drop the global `-D warnings` (that stays on the
# lint/audit jobs) so a stray warning never masks a test signal.

.test-rules-default-branch:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "schedule"

test-contracts:
  extends: .test-rules-default-branch
  stage: test
  image: rust:1.96-bookworm@sha256:a339861ae23e9abb272cea45dfafde21760d2ce6577a70f8a926153677902663
  variables:
    RUSTFLAGS: "-A dead_code"
  rules:
    - !reference [.test-rules-default-branch, rules]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - smartcontracts/**/*
        - .gitlab-ci.yml
  script:
    # Equivalent to `make test-contracts`.
    - cd smartcontracts && cargo test --locked

test-indexer-lib:
  extends: .test-rules-default-branch
  stage: test
  image: rust:1.96-bookworm@sha256:a339861ae23e9abb272cea45dfafde21760d2ce6577a70f8a926153677902663
  variables:
    RUSTFLAGS: "-A dead_code"
  rules:
    - !reference [.test-rules-default-branch, rules]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - indexer/**/*
        - .gitlab-ci.yml
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends libssl-dev pkg-config
  script:
    # --lib = unit tests only, no Postgres. The Postgres-backed integration suite is Phase 2.
    - cd indexer && cargo test --locked --lib

test-frontend:
  extends: .test-rules-default-branch
  stage: test
  image: node:24-bookworm@sha256:64af3819f9275802414d7cdc38c27e9d82bd564dec4d4da87d008255d36c63b4
  rules:
    - !reference [.test-rules-default-branch, rules]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - frontend-dapp/**/*
        - .gitlab-ci.yml
  before_script:
    - cd frontend-dapp && npm ci
  script:
    # Equivalent to `make lint-frontend` + `make test-frontend`.
    - npm run lint
    - npm run test:run

# Build gate — catches tsc -b / vite build breaks that lint + vitest do NOT. This is the recurring
# blind spot: #246, then four more tsc-only breaks reached main (see #337 thread) because the
# pipeline never ran a cold `tsc -b`. `npm run build` = tsc -b && vite build. The dummy
# VITE_WC_PROJECT_ID satisfies the #378 prod-build guard; this proves the build compiles, it is not
# a deployable artifact. Also re-asserts #117 (no sourcemaps in a production bundle).
test-frontend-build:
  extends: .test-rules-default-branch
  stage: test
  image: node:24-bookworm@sha256:64af3819f9275802414d7cdc38c27e9d82bd564dec4d4da87d008255d36c63b4
  variables:
    VITE_WC_PROJECT_ID: "ci-build-typecheck"
  rules:
    - !reference [.test-rules-default-branch, rules]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - frontend-dapp/**/*
        - .gitlab-ci.yml
  before_script:
    - cd frontend-dapp && npm ci
  script:
    - npm run build
    - 'if find dist -name "*.map" | grep -q .; then echo "prod dist has sourcemaps - violates issue 117"; exit 1; fi'

# Phase 2a (GitLab #421): Postgres-backed indexer integration suite — the full `indexer/tests/`
# suite that test-indexer-lib skips. Uses a `postgres` service container (no DinD / no LocalTerra).
# The harness (indexer/tests/common/mod.rs::setup_pool) runs sqlx::migrate!() itself, so the service
# provisions the dedicated dex_indexer_qa CREATEDB role and admin-owned marked control DB.
# Each integration binary migrates a fresh disposable child database; tests inside a binary
# remain serial (-j1 + --test-threads=1), while worktrees/binaries own separate histories. The remaining Phase-2 row (scheduled DinD-LocalTerra Playwright E2E) is
# tracked separately under #421.
test-indexer-integration:
  extends: .test-rules-default-branch
  stage: test
  image: rust:1.96-bookworm@sha256:a339861ae23e9abb272cea45dfafde21760d2ce6577a70f8a926153677902663
  services:
    - name: postgres:16@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54
      alias: postgres
  variables:
    RUSTFLAGS: "-A dead_code"
    # Bootstrap administrator belongs only to the disposable service; tests use QA.
    POSTGRES_DB: postgres
    POSTGRES_USER: cl8y_ci
    POSTGRES_PASSWORD: cl8y_ci
    TEST_DATABASE_ADMIN_URL: "postgres://dex_indexer_qa:ci-qa-disposable@postgres:5432/dex_indexer_test"
  rules:
    - !reference [.test-rules-default-branch, rules]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - indexer/**/*
        - .gitlab-ci.yml
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends libssl-dev pkg-config postgresql-client
    - 'for i in $(seq 1 30); do pg_isready -h postgres -U cl8y_ci -d postgres && break; sleep 2; done'
    - |
      test ! -e indexer/.env.qa
      PGPASSWORD="$POSTGRES_PASSWORD" psql -h postgres -U cl8y_ci -d postgres -v ON_ERROR_STOP=1 <<'SQL'
      CREATE ROLE dex_indexer_qa LOGIN CREATEDB NOSUPERUSER NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS PASSWORD 'ci-qa-disposable';
      CREATE ROLE dex_indexer_runtime NOLOGIN NOCREATEDB NOSUPERUSER NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
      CREATE DATABASE dex_indexer_test;
      COMMENT ON DATABASE dex_indexer_test IS 'cl8y-dex:isolated-qa:v1';
      REVOKE ALL ON DATABASE dex_indexer_test FROM PUBLIC;
      GRANT CONNECT ON DATABASE dex_indexer_test TO dex_indexer_qa;
      REVOKE CONNECT ON DATABASE postgres FROM PUBLIC;
      SQL
  script:
    # A fresh database/history per binary; no shared SQLx migration state.
    - cd indexer && cargo test --locked --tests -j 1 -- --test-threads=1

# --- Build stage (#325) ---

qa-wasm-artifacts:
  stage: build
  image: docker:24@sha256:9b17a9f25adf17b88d0a013b4f00160754adf4b07ccbe9986664a49886c2c98e
  services:
    - name: docker:24-dind@sha256:9b17a9f25adf17b88d0a013b4f00160754adf4b07ccbe9986664a49886c2c98e
      alias: docker
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"
      changes:
        - smartcontracts/**/*
        - scripts/deploy-dex-local.sh
        - .gitlab-ci.yml
    - if: $CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"
  before_script:
    - apk add --no-cache bash curl make git jq python3 coreutils
    - |
      for i in $(seq 1 60); do
        if docker info >/dev/null 2>&1; then
          echo "Docker (TLS) ready"
          break
        fi
        if [ "$i" -eq 60 ]; then
          echo "ERROR: docker info failed after 60s (check DinD TLS certs)"
          exit 1
        fi
        sleep 1
      done
  script:
    - make build-optimized
    - chmod +x scripts/qa/publish-qa-ci-artifacts.sh
    - PUBLISH_QA_INDEXER=0 ./scripts/qa/publish-qa-ci-artifacts.sh
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - smartcontracts/artifacts/cl8y_dex_*.wasm
      - smartcontracts/wasm-checksums.txt
      - smartcontracts/artifacts/build-provenance.json

qa-indexer-binary:
  stage: build
  # base64ct 1.8+ needs edition 2024 (Rust 1.85+); align with AGENTS.md 1.96+ local toolchain.
  image: rust:1.96-bookworm@sha256:a339861ae23e9abb272cea45dfafde21760d2ce6577a70f8a926153677902663
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"
      changes:
        - indexer/**/*
        - .gitlab-ci.yml
    - if: $CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends libssl-dev pkg-config curl python3
  script:
    - bash scripts/ci/build-indexer-release.sh
    - chmod +x scripts/qa/publish-qa-ci-artifacts.sh
    - PUBLISH_QA_WASM=0 ./scripts/qa/publish-qa-ci-artifacts.sh
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - indexer/target/release/cl8y-dex-indexer
      - indexer/target/release/build-provenance.json
