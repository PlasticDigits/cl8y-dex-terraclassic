# GitLab CI — QA artifact publishing (GitLab #325) + supply-chain security (#380 / #376).
# Reference GitHub workflows in .github/workflows/ are not executed here.

stages:
  - security
  - build

variables:
  CARGO_HOME: ${CI_PROJECT_DIR}/.cargo
  # -A dead_code: binary target has many intentional stubs (LCD types, sqlx rows); #325 never got a green run before #370.
  RUSTFLAGS: "-D warnings -A dead_code"

# --- Security stage (#380) ---------------------------------------------------
# Budget target: security jobs add <5 min median vs pre-#380 pipelines (H-06).

.security_on_default_branch:
  stage: security
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "schedule"

gitleaks:
  extends: .security_on_default_branch
  image:
    name: zricethezav/gitleaks:v8.21.2
    entrypoint: [""]
  script:
    - chmod +x scripts/ci/gitleaks-detect.sh
    - ./scripts/ci/gitleaks-detect.sh

cargo-audit-smartcontracts:
  extends: .security_on_default_branch
  image: rust:1.96-bookworm
  script:
    - cargo install cargo-audit --locked
    - cd smartcontracts && cargo audit --deny warnings

cargo-audit-indexer:
  extends: .security_on_default_branch
  image: rust:1.96-bookworm
  script:
    - cargo install cargo-audit --locked
    - cd indexer && cargo audit --deny warnings

npm-audit-frontend:
  extends: .security_on_default_branch
  image: node:24-bookworm
  script:
    - cd frontend-dapp && npm ci --omit=dev
    - cd frontend-dapp && npm audit --audit-level=high --omit=dev

# --- Build stage (#325) ------------------------------------------------------

qa-wasm-artifacts:
  stage: build
  image: docker:24
  services:
    - name: docker:24-dind
      alias: docker
  # DinD TLS (M-11): use GitLab defaults — DOCKER_TLS_CERTDIR=/certs, port 2376.
  # Unencrypted tcp://docker:2375 allowed sibling containers in the job pod to control Docker.
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - smartcontracts/**/*
        - scripts/deploy-dex-local.sh
        - .gitlab-ci.yml
    - if: $CI_PIPELINE_SOURCE == "web"
  before_script:
    - apk add --no-cache bash curl make git jq
    - until docker info; do sleep 1; done
  script:
    - make build-optimized
    - chmod +x scripts/qa/publish-qa-ci-artifacts.sh
    - PUBLISH_QA_INDEXER=0 ./scripts/qa/publish-qa-ci-artifacts.sh
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - smartcontracts/artifacts/cl8y_dex_*.wasm
      - smartcontracts/wasm-checksums.txt

qa-indexer-binary:
  stage: build
  # base64ct 1.8+ needs edition 2024 (Rust 1.85+); align with AGENTS.md 1.96+ local toolchain.
  image: rust:1.96-bookworm
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - indexer/**/*
        - .gitlab-ci.yml
    - if: $CI_PIPELINE_SOURCE == "web"
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends libssl-dev pkg-config curl
  script:
    - cd indexer && cargo build --release
    - chmod +x ../scripts/qa/publish-qa-ci-artifacts.sh
    - cd .. && PUBLISH_QA_WASM=0 ./scripts/qa/publish-qa-ci-artifacts.sh
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - indexer/target/release/cl8y-dex-indexer
