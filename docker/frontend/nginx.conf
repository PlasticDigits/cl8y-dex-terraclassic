server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers (CSP is injected into index.html at vite build — do not duplicate here)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # SPA client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Forgejo #1212: crawl files are never SPA routes, even when a deploy omits them.
    location = /robots.txt {
        types { }
        default_type text/plain;
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location = /sitemap.xml {
        # Clear inherited mime.types: its .xml mapping would override default_type.
        types { }
        default_type application/xml;
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Reject crawl-file siblings (backups, trailing slashes, sitemap indexes).
    # Exact locations above win; unrelated browser routes retain SPA fallback.
    location ~* ^/(robots\.txt|sitemap(_index)?\.xml)([/.].*)?$ {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        return 404;
    }

    # GitLab #578: OG/Twitter card must be a real image (not SPA index.html).
    location = /og-image.png {
        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Hashed 200s stay long-cache immutable. Missing JS/CSS must 404 (not SPA HTML) and
    # must not be advertised as immutable — deploy race: new index.html can name a chunk
    # not yet visible (GitLab #706).
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=604800, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri @hashed_asset_miss;
    }

    location @hashed_asset_miss {
        internal;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        return 404;
    }

    # Never cache the shell HTML (addresses / CSP are build-time). SPA try_files → here.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
}
