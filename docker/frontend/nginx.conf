server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers (CSP is injected into index.html at vite build — do not duplicate here)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # SPA client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # GitLab #578: OG/Twitter card must be a real image (not SPA index.html).
    location = /og-image.png {
        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Hashed 200s stay long-cache immutable. Missing JS/CSS must 404 (not SPA HTML) and
    # must not be advertised as immutable — deploy race: new index.html can name a chunk
    # not yet visible (GitLab #706).
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=604800, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri @hashed_asset_miss;
    }

    location @hashed_asset_miss {
        internal;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        return 404;
    }

    # Never cache the shell HTML (addresses / CSP are build-time). SPA try_files → here.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
}
