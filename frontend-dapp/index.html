<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CL8Y DEX - Decentralized exchange on Terra Classic" />
    <meta property="og:title" content="CL8Y DEX" />
    <meta property="og:description" content="CW20 token exchange on Terra Classic" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/og-image.png" />
    <meta name="twitter:title" content="CL8Y DEX" />
    <meta name="twitter:description" content="CW20 token exchange on Terra Classic" />
    <meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' https: wss: http://localhost:* http://127.0.0.1:*; img-src 'self' data: https:; font-src 'self';" />
    <title>CL8Y DEX</title>
    <script>
      (function() {
        var s = localStorage.getItem('cl8y-dex-theme');
        if (s !== 'dark' && s !== 'light') {
          s = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.setAttribute('data-theme', s || 'dark');
      })();
    </script>
    <style id="trade-bootstrap-style">
      html, body { margin: 0; min-height: 100%; background: #0e0908; }
      html[data-theme="light"], html[data-theme="light"] body { background: #f6efe6; }
      #trade-bootstrap-shell {
        box-sizing: border-box;
        min-height: 100vh;
        padding: 16px 12px 120px;
        font-family: system-ui, sans-serif;
        color: rgba(255, 247, 238, 0.9);
      }
      html[data-theme="light"] #trade-bootstrap-shell { color: rgba(28, 18, 12, 0.88); }
      #trade-bootstrap-shell * { box-sizing: border-box; }
      .trade-bootstrap-title {
        height: 22px; width: 72px; border-radius: 14px; margin-bottom: 10px;
        background: rgba(255, 212, 168, 0.14);
        animation: trade-bootstrap-pulse 1.2s ease-in-out infinite;
      }
      .trade-bootstrap-line {
        height: 14px; width: min(100%, 320px); border-radius: 14px; margin-bottom: 18px;
        background: rgba(255, 212, 168, 0.1);
        animation: trade-bootstrap-pulse 1.2s ease-in-out infinite;
      }
      .trade-bootstrap-panel {
        border: 1px solid rgba(255, 218, 171, 0.12);
        border-radius: 18px;
        background: rgba(34, 21, 17, 0.5);
        padding: 12px;
        margin-bottom: 12px;
      }
      html[data-theme="light"] .trade-bootstrap-panel {
        border-color: rgba(80, 48, 28, 0.12);
        background: rgba(255, 255, 255, 0.72);
      }
      .trade-bootstrap-grid {
        display: grid;
        gap: 12px;
        min-height: min(72vh, 640px);
        grid-template-columns: 1fr;
      }
      @media (min-width: 1024px) {
        .trade-bootstrap-grid { grid-template-columns: 24% 52% 24%; }
      }
      .trade-bootstrap-block {
        min-height: 280px;
        border-radius: 14px;
        background: rgba(255, 212, 168, 0.12);
        animation: trade-bootstrap-pulse 1.2s ease-in-out infinite;
      }
      @keyframes trade-bootstrap-pulse {
        0%, 100% { opacity: 0.45; }
        50% { opacity: 0.9; }
      }
    </style>
    <script>
      (function() {
        if (!/^\/trade(\/|$)/.test(location.pathname)) return;
        var root = document.getElementById('root');
        if (!root) return;
        root.innerHTML =
          '<div id="trade-bootstrap-shell" role="status" aria-busy="true" aria-label="Loading trade workspace">' +
          '<div class="trade-bootstrap-title"></div>' +
          '<div class="trade-bootstrap-line"></div>' +
          '<div class="trade-bootstrap-panel"><div class="trade-bootstrap-line" style="width:48px;margin-bottom:8px"></div>' +
          '<div class="trade-bootstrap-line" style="width:100%;max-width:480px"></div></div>' +
          '<div class="trade-bootstrap-grid">' +
          '<div class="trade-bootstrap-block"></div>' +
          '<div class="trade-bootstrap-block"></div>' +
          '<div class="trade-bootstrap-block"></div>' +
          '</div></div>';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
