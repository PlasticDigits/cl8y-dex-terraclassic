<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trade bootstrap fixture (#416)</title>
    <link rel="stylesheet" href="/bootstrap/trade-bootstrap.css" />
    <script src="/bootstrap/theme.js"></script>
  </head>
  <body>
    <div id="root">
      <div id="trade-bootstrap-shell" role="status" aria-busy="true" aria-label="Loading trade workspace">
        <div class="trade-bootstrap-title"></div>
        <div class="trade-bootstrap-line"></div>
        <div class="trade-bootstrap-panel">
          <div class="trade-bootstrap-line" style="width: 48px; margin-bottom: 8px"></div>
          <div class="trade-bootstrap-line" style="width: 100%; max-width: 480px"></div>
        </div>
        <div class="trade-bootstrap-grid">
          <div class="trade-bootstrap-block"></div>
          <div class="trade-bootstrap-block"></div>
          <div class="trade-bootstrap-block"></div>
          <div class="trade-bootstrap-block trade-bootstrap-block-tape"></div>
        </div>
      </div>
    </div>
  </body>
</html>
