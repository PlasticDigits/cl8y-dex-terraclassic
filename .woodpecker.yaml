# Trusted Woodpecker PR/main gate. Forgejo branch protection requires
# context `ci/woodpecker/pr/woodpecker`. Functional cargo/frontend/indexer
# jobs stay on the local Make matrix until a follow-up ports GitLab CI.
#
# Digest-pinned images. Do not float tags.

when:
  - event: [push, manual]
    branch: main
  - event: pull_request

steps:
  - name: gitleaks
    image: alpine:3.22@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce
    commands:
      - |
        set -euo pipefail
        apk add --no-cache bash curl git
        curl -fsSL -o /tmp/gitleaks.tgz \
          https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz
        echo "79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e  /tmp/gitleaks.tgz" | sha256sum -c
        tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
        install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
        chmod +x scripts/ci/gitleaks-scan-tracked.sh
        ./scripts/ci/gitleaks-scan-tracked.sh --verbose --exit-code 1
