# cargo-audit allowlist — indexer (GitLab #380 / H-06).
# Run: cd indexer && cargo audit --deny warnings
# See docs/supply-chain-security.md for rationale and upgrade tracking.

[advisories]
ignore = [
    # rsa 0.9.x — sqlx/mysql transitive; RustSec: no fixed upgrade available.
    "RUSTSEC-2023-0071",
    # rand unsound only when a custom logger is installed; indexer does not configure one.
    "RUSTSEC-2026-0097",
]
