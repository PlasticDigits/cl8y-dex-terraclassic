# Stable project name so git worktrees share the same LocalTerra/Postgres stack.
name: cl8y-dex-terraclassic

services:
  localterra:
    # Pinned digest for reproducible QA; tag: ghcr.io/plasticdigits/localterra-cl8y:latest (terrad v4.0.1 / SDK 0.53.6 — GitLab #292)
    image: ghcr.io/plasticdigits/localterra-cl8y@sha256:29e2d125c123a230aac86b72e781b33db3f357f00fa44c751249a9a2c2512faf
    platform: linux/amd64
    ports:
      - "127.0.0.1:26657:26657"
      - "127.0.0.1:1317:1317"
      - "127.0.0.1:9090:9090"
      - "127.0.0.1:9091:9091"
    volumes:
      - localterra-data:/home/terra/.terra
      - ./docker/init-chain.sh:/usr/local/bin/init-chain.sh:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:26657/status"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres:
    # Pinned digest; bump via: docker pull postgres:16-alpine && docker inspect ...
    image: postgres@sha256:20edbde7749f822887a1a022ad526fde0a47d6b2be9a8364433605cf65099416
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cl8y_legal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cl8y_legal}
      POSTGRES_DB: ${POSTGRES_DB:-dex_indexer}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-cl8y_legal}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  localterra-data:
  postgres-data:
