# Local chain stack. Integration tests create disposable databases (#1396).
name: cl8y-dex-terraclassic

services:
  localterra:
    # Pinned digest for reproducible QA; tag: ghcr.io/plasticdigits/localterra-cl8y:latest (terrad v4.0.1 / SDK 0.53.6 — GitLab #292)
    image: ghcr.io/plasticdigits/localterra-cl8y@sha256:309cdb1215135795ca47f2803cde6c1e7045afcfc6379dd6600bf578148ae81a
    platform: linux/amd64
    ports:
      - "127.0.0.1:26657:26657"
      - "127.0.0.1:1317:1317"
      - "127.0.0.1:9090:9090"
      - "127.0.0.1:9091:9091"
    volumes:
      - localterra-data:/home/terra/.terra
      - ./docker/init-chain.sh:/usr/local/bin/init-chain.sh:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:26657/status"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres:
    # Pinned digest; bump via: docker pull postgres:16-alpine && docker inspect ...
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    entrypoint: ["/usr/local/bin/cl8y-postgres-entrypoint.sh"]
    command: ["postgres"]
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      # Bootstrap identity is separate from the runtime/migrator/QA logins.
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?Set a nondefault bootstrap password in .env}
      POSTGRES_DB: ${POSTGRES_DB:-dex_indexer}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
      - ./docker/postgres-entrypoint.sh:/usr/local/bin/cl8y-postgres-entrypoint.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  localterra-data:
  postgres-data:
