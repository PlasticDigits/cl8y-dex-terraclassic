[extend]
useDefault = true

# BIP39-like sequences (12+ lowercase 3–8 letter words in quotes) are not covered by generic gitleaks rules.
# Scope to app source; tests are allowlisted because they may contain long quoted fixtures. GitLab #118.
[[rules]]
id = "bip39-like-phrase-frontend-src"
description = "Quoted BIP39-like multi-word line in frontend app source"
regex = '''['\"]([a-z]{3,8}(?:\s[a-z]{3,8}){11,})['\"]'''
path = '''(?i)(frontend-dapp|frontend)/src/.*\.(ts|tsx)$'''
[rules.allowlist]
paths = [
  '''.*\.test\.ts$''',
  '''.*\.test\.tsx$''',
  '''.*\.spec\.ts$''',
  '''.*\.spec\.tsx$''',
]

[allowlist]
description = "Allow Terra Classic addresses, crypto type names, and CI fixtures"
regexTarget = "secret"
paths = [
  # Single known CI fixture for bip39-like-phrase-frontend-src (GitLab #380).
  # Do not allowlist the whole fixture tree — verify-gitleaks uses gitleaks-fixture.toml.
  '''scripts/ci/gitleaks-fixture/frontend-dapp/src/bip39-violation\.ts$''',
  # Rust/npm build outputs (false positives on "private-key" in .rmeta / bundles).
  '''(?:^|/)(?:target|node_modules|dist|coverage)(?:/|$)''',
]
regexes = [
  '''terra1[a-z0-9]{38,}''',
  '''Secp256k1PubKey''',
  # localStorage key for first-visit risk acknowledgement (GitLab #138); not a credential.
  '''cl8y-dex-risk-ack''',
]
