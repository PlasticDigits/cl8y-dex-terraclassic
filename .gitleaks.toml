[extend]
useDefault = true

# BIP39-like sequences (12+ lowercase 3–8 letter words in quotes) are not covered by generic gitleaks rules.
# Scope to app source; tests are allowlisted because they may contain long quoted fixtures. GitLab #118.
[[rules]]
id = "bip39-like-phrase-frontend-src"
description = "Quoted BIP39-like multi-word line in frontend app source"
regex = '''['\"]([a-z]{3,8}(?:\s[a-z]{3,8}){11,})['\"]'''
path = '''(?i)(frontend-dapp|frontend)/src/.*\.(ts|tsx)$'''
[rules.allowlist]
paths = [
  '''.*\.test\.ts$''',
  '''.*\.test\.tsx$''',
  '''.*\.spec\.ts$''',
  '''.*\.spec\.tsx$''',
]
# CI fixture only (scripts/ci/gitleaks-fixture/.../bip39-violation.ts); not a path allowlist.
regexes = [
  '''abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon about''',
]

[allowlist]
description = "Allow Terra Classic addresses, crypto type names, and app-specific non-secrets"
regexTarget = "secret"
# node_modules/ only for local --no-git scans; CI uses scripts/ci/gitleaks-scan-tracked.sh (git-tracked only).
regexes = [
  '''terra1[a-z0-9]{38,}''',
  '''Secp256k1PubKey''',
  # localStorage key for first-visit risk acknowledgement (GitLab #138); not a credential.
  '''cl8y-dex-risk-ack''',
]
paths = [
  # node_modules/ is gitignored; allowlist applies to --no-git local working-tree scans (GitLab #380).
  # Do not allowlist target/: force-committed secrets under */target/ must fail CI git-range scans.
  '''(?:^|/)node_modules/''',
]
