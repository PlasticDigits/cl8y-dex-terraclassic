[extend]
useDefault = true

# BIP39-like sequences (12+ lowercase 3–8 letter words in quotes) are not covered by generic gitleaks rules.
# Scope to app source; tests are allowlisted because they may contain long quoted fixtures. GitLab #118.
[[rules]]
id = "bip39-like-phrase-frontend-src"
description = "Quoted BIP39-like multi-word line in frontend app source"
regex = '''['\"]([a-z]{3,8}(?:\s[a-z]{3,8}){11,})['\"]'''
path = '''(?i)(frontend-dapp|frontend)/src/.*\.(ts|tsx)$'''
[rules.allowlist]
paths = [
  '''.*\.test\.ts$''',
  '''.*\.test\.tsx$''',
  '''.*\.spec\.ts$''',
  '''.*\.spec\.tsx$''',
]
# CI fixture only (scripts/ci/gitleaks-fixture/.../bip39-violation.ts); not a path allowlist.
regexes = [
  '''abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon about''',
]

[allowlist]
description = "Allow Terra Classic addresses, crypto type names, and app-specific non-secrets"
regexTarget = "secret"
# No repo-local path allowlist for build/dependency trees. CI remaps tracked node_modules/
# paths in scripts/ci/gitleaks-scan-tracked.sh because useDefault inherits a built-in
# node_modules/ exclusion that cannot be overridden in TOML (GitLab #380).
regexes = [
  # 38+ covers real on-chain addresses; 10+ also covers shorter synthetic terra1 fixtures
  # used in test data (e.g. indexer/tests/common/mod.rs token_ustc = "terra1ustcquote293"),
  # which generic-api-key's entropy heuristic otherwise flags as a leaked secret.
  '''terra1[a-z0-9]{10,}''',
  '''Secp256k1PubKey''',
  # localStorage key for first-visit risk acknowledgement (GitLab #138); not a credential.
  '''cl8y-dex-risk-ack''',
  # localStorage key for UI sound mute preference (GitLab #487); not a credential.
  '''cl8y-dex-sounds-enabled''',
  # localStorage keys for /trade workspace panel prefs (GitLab #417 / #561); not credentials.
  '''cl8y-dex-trade-(tape-expanded|wallet-history-expanded|book-visible|ticket-visible)''',
  # Venus Core Pool vFDUSD (BSC) public contract pin (GitLab #571); not a credential.
  '''0xC4eF4229FEc74Ccfe17B2bdeF7715fAC740BA0ba''',
]
